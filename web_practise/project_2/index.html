<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Login</title>
  </head>
  <body>
    <div class="login_container">
      <div class="login_card">
        <h1>ورود به پنل کاربری</h1>
        <p>آموزشگاه سرزمین دانش</p>
        <form action="#" method="post">
          <div class="input_group floating">
            <input type="text" name="username" id="username" />
            <label for="username">username</label>
            <i class="fa fa-user"></i>
            <div class="underline"></div>
          </div>
          <div class="input_group floating">
            <input type="text" name="password" id="password" />
            <label for="password">password</label>
            <i class="fa fa-user"></i>
            <div class="underline"></div>
          </div>
          <div class="option">
            <label class="remmeber">
              <input type="checkbox" />
              <span class="checkmark"></span>
             save info login ...
            </label>
            <a href="#" class="forget_password">Foreget password</a>
          </div>
          <button type="submit" class="btn_login"><span>Login</span> <i class="fas fa-arrow-right"></i></button>
           <div class="divider">
            <span>OR</span>
           </div>
          <div class="social_login">
            <button type="button" class="btn_social">
                <span>Login with google</span>
                <i class="fas fa-google"></i>
            </button>
            <button type="button" class="btn_social">
                <span>Login with apple</span>
                <i class="fas fa-apple"></i>
            </button>
            <button type="button" class="btn_social">
                <span>Login with github</span>
                <i class="fas fa-github"></i>
            </button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
